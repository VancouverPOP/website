name: Build Website - PR

on:
  pull_request:
    branches: ["main"]

  workflow_dispatch:

env:
  BUILD_PATH: "."

jobs:
  build:
    name: Build website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install node and pnpm
        uses: pnpm/setup@v3
      - name: Build with Astro
        run: |
          pnpm astro build
        working-directory: ${{ env.BUILD_PATH }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: website
          path: dist/
